<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Taiba Home Rehab</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #073b32, #0b5548);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fffdf7;
      border-radius: 24px;
      padding: 35px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #f4ead5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b5548;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      color: #0b5548;
      margin: 5px 0;
      font-size: 27px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      text-align: right;
      margin: 14px 0 7px;
      color: #174d43;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      direction: ltr;
    }

    input:focus {
      border-color: #b99a55;
      box-shadow: 0 0 0 3px rgba(185,154,85,.15);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: 0;
      border-radius: 12px;
      background: #b99a55;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #a68845;
    }

    .forgot {
      display: block;
      margin-top: 18px;
      color: #0b5548;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      color: #b00020;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">THR</div>

    <h1>Taiba Home Rehab</h1>

    <div class="subtitle">
      منصة طيبة لإدارة ومتابعة برامج التأهيل
    </div>

    <form id="loginForm">

      <label for="email">البريد الإلكتروني</label>
      <input
        id="email"
        type="email"
        placeholder="doctor@example.com"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        type="password"
        placeholder="••••••••"
        required
      >

      <button type="submit">
        تسجيل الدخول
      </button>

    </form>

    <a class="forgot" href="#">
      نسيت كلمة المرور؟
    </a>

    <div id="message"></div>

  </div>

</body>
</html>
